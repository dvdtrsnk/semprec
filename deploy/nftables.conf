#!/usr/sbin/nft -f
#
# Issue #174: the host firewall boundary, in both directions.
#
# Inbound: only SSH, HTTP, and HTTPS are reachable from outside this host — every internal
# listener (semprec-api, semprec-ai-gateway, PostgreSQL) is already bound to 127.0.0.1 (see
# services/*/src/serve.ts and deploy/docker-compose.yml), so the input chain is a second,
# independent boundary rather than the only one.
#
# Outbound: processes running as uid `semprec` may not connect to loopback, private, link-local,
# metadata, CGNAT, NAT64 or multicast destinations, apart from DNS and the Postgres/gateway
# loopback ports. Tenants supply outbound targets (MCP URLs, web-push endpoints, IMAP/SMTP hosts),
# so this is the host layer behind the in-code SSRF checks and covers DNS rebinding. Traffic of
# every other uid is untouched. See docs/adr/2026-10-03-host-egress-filtered-by-service-uid.md.
#
# The file owns exactly one table and never flushes the ruleset: on Debian, Docker programs its own
# `ip filter`/`ip nat` tables through iptables-nft in the same nftables ruleset, and a
# `flush ruleset` would delete them.

table inet semprec
flush table inet semprec

table inet semprec {
	set semprec_blocked_v4 {
		type ipv4_addr
		flags interval
		elements = {
			0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16,
			172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4,
			240.0.0.0/4
		}
	}

	set semprec_blocked_v6 {
		type ipv6_addr
		flags interval
		elements = {
			::/128, ::1/128, ::ffff:0:0/96, 64:ff9b::/96, 64:ff9b:1::/48, 100::/64,
			fc00::/7, fe80::/10, ff00::/8
		}
	}

	chain input {
		type filter hook input priority 0; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		tcp dport 22 accept
		tcp dport 80 accept
		tcp dport 443 accept

		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert, destination-unreachable, time-exceeded, packet-too-big } accept
	}

	chain output {
		type filter hook output priority 0; policy accept;

		meta skuid "semprec" jump semprec_egress
	}

	chain semprec_egress {
		ct state established,related accept

		tcp dport 53 accept
		udp dport 53 accept

		meta l4proto tcp ct original ip daddr 127.0.0.1 ct original proto-dst { 5432, 3002 } accept

		ip daddr @semprec_blocked_v4 limit rate 10/minute log prefix "semprec-egress-deny "
		ip daddr @semprec_blocked_v4 reject with icmpx type admin-prohibited
		ip6 daddr @semprec_blocked_v6 limit rate 10/minute log prefix "semprec-egress-deny "
		ip6 daddr @semprec_blocked_v6 reject with icmpx type admin-prohibited
	}
}
