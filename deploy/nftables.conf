#!/usr/sbin/nft -f
#
# Issue #174: the host firewall boundary. Only SSH, HTTP, and HTTPS are reachable from outside
# this host — every internal listener (semprec-api, semprec-ai-gateway, PostgreSQL, MinIO) is
# already bound to 127.0.0.1 (see services/*/src/serve.ts and deploy/docker-compose.yml), so this
# ruleset is a second, independent boundary rather than the only one.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		tcp dport 22 accept
		tcp dport 80 accept
		tcp dport 443 accept

		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert, destination-unreachable, time-exceeded, packet-too-big } accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
