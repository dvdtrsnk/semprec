name: Harvest review follow-ups

# Repository issue maintenance proposes local changes through a reviewed PR.
# A pending maintenance PR applies backpressure until it is merged or closed.

on:
  schedule:
    # 05:37 UTC — off the hour, so it does not join the stampede of jobs that every
    # cron scheduler fires at :00, and apart from close-completed-epics' :15 each hour.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be harvested without writing anything
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-issue-maintenance
  cancel-in-progress: false

jobs:
  harvest-review-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harvest open findings from merged pull requests
        run: node .github/scripts/issues/maintenance.mjs harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A scheduled run always writes; a manual one defaults to reporting only.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # #265 audited every pull request up to #264 and found their review memory
          # tables stale, so nothing below #266 is harvested. It is a fixed floor, never a
          # watermark: the `followups:harvested` label, not this number, records progress.
          HARVEST_MIN_PR: "266"
