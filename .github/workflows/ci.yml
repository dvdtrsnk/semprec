name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check context on `develop` — renaming it
  # or splitting it into several jobs would leave `ci` permanently pending on
  # every pull request. Keep both workspaces inside this one job.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fast tier only: type checking for the backend workspace plus the web
      # app's own build and unit tests. The backend integration suite needs a
      # PostgreSQL instance and takes ~10 minutes serially, so it is gated
      # separately once #250 lands its ephemeral-PostgreSQL tier.
      - name: Backend — install
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Backend — build
        working-directory: backend
        run: pnpm -r run build

      # No PostgreSQL needed: the unit tier (including the pi-runtime contract suite
      # in packages/agent-runtime) never imports anything that touches a real database.
      - name: Backend — test:unit
        working-directory: backend
        run: pnpm run test:unit

      # Guards the pi-runtime contract suite's premise: production code (and the
      # suite itself) may only reach pi through its documented package-root exports,
      # never an internal or example path that pi could change without a version bump.
      - name: Backend — check pi import paths
        working-directory: backend
        run: pnpm run check:pi-import-paths

      # Catches two independently-created branches each picking the same
      # next migration ordinal (e.g. two branches both adding 0011_*.sql).
      # The migration runner keys applied migrations by full filename, so a
      # collision like this never fails at the database layer or as a git
      # merge conflict — it silently applies both in alphabetical order.
      - name: Backend — check migration numbering
        working-directory: backend
        run: pnpm --filter @semprec/data run check-migration-numbering

      - name: Web — install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web — build
        working-directory: web
        run: pnpm run build

      - name: Web — test
        working-directory: web
        run: pnpm test
