name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deterministic build + test gate. The repository predates its first
      # buildable package; until one exists this passes vacuously, but the
      # required check is armed from day one so no merge ever happens without
      # this workflow having run.
      - name: Build and test
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
            npm test
          else
            echo "No buildable package yet — passing vacuously"
          fi
