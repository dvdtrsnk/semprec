name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check context on `develop` — renaming it
  # or splitting it into several jobs would leave `ci` permanently pending on
  # every pull request. Keep both workspaces inside this one job.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The review bot reads every `review-rules/scope.md` as literal glob patterns and
      # silently skips whatever they don't match, so a corrupted scope file turns the
      # required `code-review` check into a green light that reviewed nothing — which is
      # how 14 pull requests merged unreviewed. Cheap enough to run before anything else.
      - name: Review-rules scope sanity
        run: node .github/scripts/check-review-scope.mjs

      # Regression gate for two write-safety shapes (an unchecked DELETE/UPDATE result, a
      # pool.connect() outside db/pool.ts) found on PRs #380 and #386. Fails only on a
      # violation absent from the committed baseline — see the script's header comment.
      # No dependency on `node_modules`, so it runs before install alongside the other
      # dependency-free repo scan above.
      - name: Backend — check write safety
        working-directory: backend
        run: pnpm run check:write-safety

      # Backend static checks plus the unit tier; the database-backed tiers are
      # added to this same job further down.
      - name: Backend — install
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Backend — lint
        working-directory: backend
        run: pnpm run lint

      - name: Backend — format check
        working-directory: backend
        run: pnpm run format:check

      - name: Backend — build
        working-directory: backend
        run: pnpm -r run build

      # No PostgreSQL needed: the unit tier (including the pi-runtime contract suite
      # in packages/agent-runtime) never imports anything that touches a real database.
      - name: Backend — test:unit
        working-directory: backend
        run: pnpm run test:unit

      # Guards the pi-runtime contract suite's premise: production code (and the
      # suite itself) may only reach pi through its documented package-root exports,
      # never an internal or example path that pi could change without a version bump.
      - name: Backend — check pi import paths
        working-directory: backend
        run: pnpm run check:pi-import-paths

      # Catches two independently-created branches each picking the same
      # next migration ordinal (e.g. two branches both adding 0011_*.sql).
      # The migration runner keys applied migrations by full filename, so a
      # collision like this never fails at the database layer or as a git
      # merge conflict — it silently applies both in alphabetical order.
      - name: Backend — check migration numbering
        working-directory: backend
        run: pnpm --filter @semprec/data run check-migration-numbering

      # Import-boundary rules (dependency-cruiser.rules.json). Cheap enough (~2s) that
      # there is no reason for it to be a script nobody runs.
      - name: Backend — module boundaries
        working-directory: backend
        run: pnpm run check:boundaries

      # Both tiers provision their own ephemeral PostgreSQL through
      # `packages/data/src/testSupport/globalSetup.ts` — no service container needed.
      # Measured at ~3 minutes together, well inside this job's 20-minute budget.
      - name: Backend — integration tests
        working-directory: backend
        run: pnpm run test:integration

      - name: Backend — e2e tests
        working-directory: backend
        run: pnpm run test:e2e

      - name: Web — install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web — lint
        working-directory: web
        run: pnpm run lint

      - name: Web — format check
        working-directory: web
        run: pnpm run format:check

      - name: Web — build
        working-directory: web
        run: pnpm run build

      - name: Web — test
        working-directory: web
        run: pnpm test
