name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A merge lands as a push. Running on it gives every commit on `develop` and `main`
  # its own `ci` result, which #189's tag eligibility checks for the exact SHA.
  push:
    branches: [develop, main]

permissions:
  contents: read

# One group per pull request, or per pushed branch: a push run and a pull-request run
# never share a group, so neither cancels the other. Only a pull request's superseded
# runs are cancelled — every pushed commit keeps its run, because a cancelled run
# would leave that commit without the green result a release tag requires.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `main` holds released versions only and is reached exclusively through a
  # `develop -> main` promotion pull request
  # (docs/adr/2026-09-10-develop-main-branching-with-release-promotion.md). This job
  # is a required check on `main` only; on every other pull request and on every
  # push it passes without checking anything. The head ref is read through `env`,
  # never interpolated into the script, because it is chosen by whoever opens the
  # pull request.
  promotion-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A pull request into main comes from this repository's develop
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "Not a pull request into main; nothing to check."
            exit 0
          fi
          if [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD_REF" = "develop" ]; then
            echo "Promotion pull request from develop."
            exit 0
          fi
          echo "::error::main is reached only by a develop -> main promotion pull request; this one comes from ${HEAD_REPO}:${HEAD_REF}."
          exit 1

  # The job id is a required status check context on both `develop` and `main`
  # (docs/operations/required-checks.md) — renaming it or splitting it into several
  # jobs would leave `ci` permanently pending on every pull request. Keep both
  # workspaces inside this one job.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The protected-paths check (Relay may never change its own flows) is NOT here:
      # this workflow runs on `pull_request`, i.e. from the pull request's own tree,
      # so the very pull request it would catch could edit the step or the script
      # away. It lives in protected-paths.yml on `pull_request_target`, which always
      # runs the base branch's copy of both.

      # The review bot reads every `review-rules/scope.md` as literal glob patterns and
      # silently skips whatever they don't match, so a corrupted scope file turns the
      # required `code-review` check into a green light that reviewed nothing — which is
      # how 14 pull requests merged unreviewed. Cheap enough to run before anything else.
      - name: Review-rules scope sanity
        run: node .github/scripts/check-review-scope.mjs

      # Regression gate for two write-safety shapes (an unchecked DELETE/UPDATE result, a
      # pool.connect() outside db/pool.ts) found on PRs #380 and #386. Fails only on a
      # violation absent from the committed baseline — see the script's header comment.
      # No dependency on `node_modules`, so it runs before install alongside the other
      # dependency-free repo scan above.
      - name: Backend — check write safety
        working-directory: backend
        run: pnpm run check:write-safety

      # Backend static checks plus the unit tier; the database-backed tiers are
      # added to this same job further down.
      - name: Backend — install
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Backend — lint
        working-directory: backend
        run: pnpm run lint

      - name: Backend — format check
        working-directory: backend
        run: pnpm run format:check

      - name: Backend — build
        working-directory: backend
        run: pnpm -r run build

      # No PostgreSQL needed: the unit tier (including the pi-runtime contract suite
      # in packages/agent-runtime) never imports anything that touches a real database.
      - name: Backend — test:unit
        working-directory: backend
        run: pnpm run test:unit

      # Guards the pi-runtime contract suite's premise: production code (and the
      # suite itself) may only reach pi through its documented package-root exports,
      # never an internal or example path that pi could change without a version bump.
      - name: Backend — check pi import paths
        working-directory: backend
        run: pnpm run check:pi-import-paths

      # Catches two independently-created branches each picking the same
      # next migration ordinal (e.g. two branches both adding 0011_*.sql).
      # The migration runner keys applied migrations by full filename, so a
      # collision like this never fails at the database layer or as a git
      # merge conflict — it silently applies both in alphabetical order.
      - name: Backend — check migration numbering
        working-directory: backend
        run: pnpm --filter @semprec/data run check-migration-numbering

      # Import-boundary rules (dependency-cruiser.rules.json). Cheap enough (~2s) that
      # there is no reason for it to be a script nobody runs.
      - name: Backend — module boundaries
        working-directory: backend
        run: pnpm run check:boundaries

      # `semprec-transcribe` shells out to ffmpeg/ffprobe (#246), and the integration
      # tier exercises that for real rather than mocking the binaries away. They are a
      # system dependency, not an npm one, and the GitHub-hosted runner image does not
      # carry them — without this step the tier fails with `spawn ffmpeg ENOENT`.
      - name: Backend — install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Both tiers provision their own ephemeral PostgreSQL through
      # `packages/data/src/testSupport/globalSetup.ts` — no service container needed.
      # Measured at ~3 minutes together, well inside this job's 20-minute budget.
      - name: Backend — integration tests
        working-directory: backend
        run: pnpm run test:integration

      - name: Backend — e2e tests
        working-directory: backend
        run: pnpm run test:e2e

      - name: Web — install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web — lint
        working-directory: web
        run: pnpm run lint

      - name: Web — format check
        working-directory: web
        run: pnpm run format:check

      - name: Web — build
        working-directory: web
        run: pnpm run build

      - name: Web — test
        working-directory: web
        run: pnpm test
