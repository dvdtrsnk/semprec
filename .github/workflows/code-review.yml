name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout semprec
        uses: actions/checkout@v4

      - name: Checkout code-review-bot (private)
        uses: actions/checkout@v4
        with:
          repository: dvdtrsnk/code-review-bot
          token: ${{ secrets.CODE_REVIEW_BOT_TOKEN }}
          path: .code-review-bot

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          # develop -> main is a release promotion, not a feature review: switch
          # to the bot's release-readiness rules (migrations/config/rollback/
          # security) instead of re-running the standard per-platform review
          # over the whole accumulated diff.
          PROMOTION_SOURCE: develop
          PROMOTION_TARGET: main
          # Block the merge on medium findings, not just critical/high. The
          # bot's default verdict for a medium finding is `comments`, which it
          # reports as a `neutral` Check Run conclusion — and GitHub counts
          # `neutral` as satisfied for a required status check. That is how 39
          # findings across 42 merged pull requests ended up in summary comments
          # nobody was obliged to act on.
          REVIEW_BLOCK_SEVERITY: medium
        run: bash "${GITHUB_WORKSPACE}/.code-review-bot/scripts/run-review-github.sh"
