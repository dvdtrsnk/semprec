name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: code-review-${{ inputs.pull_request || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # This job id is a required status check context on `develop` — renaming it
  # or splitting it into several jobs would leave `review` permanently pending
  # on every pull request. Keep the workflow's review lifecycle in this one job.
  review:
    runs-on: ubuntu-latest
    # A Relay-managed pull request answers every agent through the Relay broker,
    # which spawns a hidden agent thread per call and serializes them per pull
    # request. A measured run took 22 minutes to finish its platform and
    # acceptance-criteria agents before the summary agent even started, so the
    # old 30-minute budget cancelled the job mid-summary. Sized for that path;
    # a non-Relay review finishes well inside it.
    timeout-minutes: 60
    steps:
      - name: Checkout semprec
        uses: actions/checkout@v4
        with:
          # Deliberately review the PR head in both trigger modes, rather than the
          # pull_request merge ref. The bot gets changed files from the PR API and
          # anchors its Check Run to that head, so agents must read the same tree.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pull_request) }}

      - name: Checkout code-review-bot (private)
        uses: actions/checkout@v4
        with:
          repository: dvdtrsnk/code-review-bot
          # The code-review Check Run is required on `develop`; keep its producer
          # stable so a bot default-branch change cannot rename that context.
          ref: 4a98bc890c9c57e2d53f2bd50d77eaf350488a09
          token: ${{ secrets.CODE_REVIEW_BOT_TOKEN }}
          path: .code-review-bot

      - name: Install Claude Code CLI
        run: |
          curl -fsSL --connect-timeout 10 --max-time 60 https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number }}
          # Keep the required Check Run name under this repository's control even
          # if the bot changes its default in a later pinned revision.
          GH_CHECK_NAME: code-review
          # The default GITHUB_TOKEN cannot call resolveReviewThread ("Resource not
          # accessible by integration"), so a finding the bot has already fixed
          # replies "Fixed." but never actually closes the thread — which silently
          # defeats required_conversation_resolution below. CODE_REVIEW_BOT_TOKEN
          # (a classic PAT scoped to the whole account) hits the same restriction
          # under a different error ("by personal access token") because it wasn't
          # granted the Pull requests scope. PR_RESOLVE_TOKEN is a fine-grained PAT
          # scoped only to this repo with Pull requests: read/write, dedicated to
          # this one mutation. Secret names can't start with GITHUB_, hence the
          # differing names either side of this mapping.
          GITHUB_RESOLVE_TOKEN: ${{ secrets.PR_RESOLVE_TOKEN }}
          # ANTHROPIC_API_KEY stores the Claude Code OAuth token used by the CLI;
          # the secret name predates this workflow and cannot be renamed here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          # Relay-managed PRs obtain their provider and model from the short-lived
          # broker session, rather than this fallback Claude credential.
          RELAY_BROKER_URL: ${{ secrets.RELAY_BROKER_URL }}
          RELAY_BROKER_SECRET: ${{ secrets.RELAY_BROKER_SECRET }}
          RELAY_REAL_CLAUDE_BIN: claude
          # develop -> main is a release promotion, not a feature review: switch
          # to the bot's release-readiness rules (migrations/config/rollback/
          # security) instead of re-running the standard per-platform review
          # over the whole accumulated diff.
          PROMOTION_SOURCE: develop
          PROMOTION_TARGET: main
          # Block the merge on medium findings, not just critical/high. The
          # bot's default verdict for a medium finding is `comments`, which it
          # reports as a `neutral` Check Run conclusion — and GitHub counts
          # `neutral` as satisfied for a required status check. That is how 39
          # findings across 42 merged pull requests ended up in summary comments
          # nobody was obliged to act on.
          REVIEW_BLOCK_SEVERITY: medium
        run: bash "${GITHUB_WORKSPACE}/.code-review-bot/scripts/run-review-github.sh"

      - name: Finalize interrupted code-review check
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${CODE_REVIEW_CHECK_RUN_ID:-}" ]; then
            echo "No Check Run ID was exported; nothing to finalize."
            exit 0
          fi

          if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CODE_REVIEW_CHECK_RUN_ID}" --jq '.status')"; then
            echo "::warning::Could not read Check Run ${CODE_REVIEW_CHECK_RUN_ID}; leaving it unchanged."
            exit 0
          fi
          if [ "$status" = "completed" ]; then
            echo "Check Run ${CODE_REVIEW_CHECK_RUN_ID} was completed by the review bot."
            exit 0
          fi

          # The trailing marker is the contract an orchestrator reads to tell a
          # reviewer-side breakage from real findings. Without it, Relay sees a
          # failing check with no outcome class and sends the implementer back to
          # rewrite code against a review that never produced a single finding.
          summary=$(printf '%s\n\n%s' \
            "The review workflow ended before the review bot completed this Check Run. Re-run the Code Review workflow for a fresh verdict." \
            "<!-- crb-outcome:v1:infra-failure -->")

          if ! jq -n \
            --arg summary "$summary" \
            '{status: "completed", conclusion: "cancelled", output: {title: "AI Review — Cancelled", summary: $summary}}' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CODE_REVIEW_CHECK_RUN_ID}" --input - > /dev/null; then
            echo "::warning::Could not finalize Check Run ${CODE_REVIEW_CHECK_RUN_ID}; leaving it unchanged."
            exit 0
          fi
          echo "Finalized interrupted Check Run ${CODE_REVIEW_CHECK_RUN_ID}."
