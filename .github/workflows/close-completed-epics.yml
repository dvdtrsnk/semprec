name: Close completed epics

# Repository issue maintenance proposes local changes through a reviewed PR.
# A pending maintenance PR applies backpressure until it is merged or closed.

on:
  schedule:
    # The fallback. :15 past every hour — off the hour, so it does not join the
    # stampede of jobs that every cron scheduler fires at :00.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen without writing anything
        type: boolean
        default: true
      grace_hours:
        description: How old the announcement must be before the epic is closed
        type: string
        default: "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-issue-maintenance
  cancel-in-progress: false

jobs:
  close-completed-epics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Close epics whose sub-issues are all done
        run: node .github/scripts/issues/maintenance.mjs epics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A scheduled or issue-triggered run always writes (`inputs` is empty outside
          # workflow_dispatch, so these fall through to 'false' and '1'); a manual run
          # defaults to reporting only.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          GRACE_HOURS: ${{ inputs.grace_hours || '1' }}
