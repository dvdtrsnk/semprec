version: 1
protected-paths: [".relay/**", ".github/workflows/**", ".github/scripts/check-protected-paths.mjs"]
defaults:
  worker: any                 # any preset in project.workerIds, or a preset name
  max-concurrent: 3           # per workflow (runs of this one workflow), unless it overrides it;
                              # the cross-workflow cap on issues in flight is the project's
                              # maxConcurrent in the plugin
  timeout-minutes: 120        # per command step
review:
  # dvdtrsnk/code-review-bot#24 (feat/relay-out-of-actions) merged to main as
  # 96a0439137f4424700ff3c76209f146498f101d1: the out-of-Actions contract
  # (CRB_TMP_DIR/TMPDIR scratch isolation, BOT_USERNAME in both spellings the
  # bot reads) is now what this pin runs. `max-concurrent: 1` was dropped from
  # workflows/review-pull-request.md accordingly.
  # dvdtrsnk/code-review-bot#27 merged to main as
  # 9e732e791c6bcdbfa4683d6ad93ed1f7441a3d61: fixes cheap reuse-after-rebase
  # never firing for a PR whose review found zero issues (the common case) —
  # a clean PR's recorded verdict was silently dropped instead of persisted,
  # so a rebase always fell through to a full review.
  # dvdtrsnk/code-review-bot#28 merged to main as
  # aa7d7e07f3bc3552887708a49dc319a3f4a2f640: verdict reuse keys on a
  # line-number-free diff identity, so a rebase onto a develop that changed the
  # same file elsewhere no longer forces a full review. The checkout ref in
  # .github/workflows/code-review.yml intentionally still pins 9e732e7 until the
  # choke-point-split batch (#494) completes — see #548.
  bot: { repo: dvdtrsnk/code-review-bot, ref: aa7d7e07f3bc3552887708a49dc319a3f4a2f640 }
  check-name: code-review
  env: { REVIEW_BLOCK_SEVERITY: medium, PROMOTION_SOURCE: develop, PROMOTION_TARGET: main }
merge:
  method: rebase              # the only method Relay implements
labels:                       # names the shipped workflows use; free to rename
  blocked: agent:blocked
  needs-human-action: agent:needs-human-action
