org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g -XX:ReservedCodeCacheSize=128m
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin 2.2.21 warns for every Xcode newer than the last version it knows (16.0). The frameworks link and
# the native tests pass with Xcode 27.1, so the warning is silenced instead of printed on every Xcode build.
kotlin.apple.xcodeCompatibility.nowarn=true
